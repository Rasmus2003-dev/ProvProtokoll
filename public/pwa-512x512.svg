<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003882"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="8"/>

  <!-- Steering Wheel Outer Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="24" filter="url(#shadow)"/>

  <!-- Center Hub -->
  <circle cx="256" cy="256" r="44" fill="#ffffff"/>
  <circle cx="256" cy="256" r="32" fill="#002F6C"/>
  <circle cx="256" cy="256" r="12" fill="url(#goldGrad)"/>

  <!-- Spokes -->
  <path d="M 256 126 L 256 212" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round"/>
  <path d="M 148 318 L 222 272" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round"/>
  <path d="M 364 318 L 290 272" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round"/>

  <!-- Success Checkmark Badge at top right -->
  <g transform="translate(320, 100)">
    <circle cx="36" cy="36" r="38" fill="#10b981" filter="url(#shadow)"/>
    <path d="M 20 36 L 31 47 L 52 24" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
