<!doctype html>
<html lang="sv" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <title>ProvProtokoll - Digital Förarprovshantering</title>
    <!-- Standalone mobile app setup -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DigitaltProtokoll" />
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (_) {}
    </script>
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      #app-initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #002F6C;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        z-index: 99999;
      }
      .loader-title {
        font-family: 'Barlow Semi Condensed', 'Inter', sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .loader-title span { color: #93c5fd; }
      /* Vägmarkering som rullar – samma motiv som stegindikatorn i provet */
      .loader-road {
        width: 132px;
        height: 6px;
        border-radius: 3px;
        background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.85) 0 18px, transparent 18px 26px);
        animation: road 0.9s linear infinite;
      }
      @keyframes road { to { background-position: 26px 0; } }
      @media (prefers-reduced-motion: reduce) { .loader-road { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-initial-loader" role="status" aria-label="Laddar ProvProtokoll">
        <div class="loader-title">Prov<span>Protokoll</span></div>
        <div class="loader-road"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
